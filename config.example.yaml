# Example configuration file for Ayyy-AI
# Copy this to config.yaml and customize as needed

# LLM API Configuration
base_url: "http://localhost:1234/v1"  # LM Studio default
api_key: "lm-studio-key"              # Often not needed for local models
model: "qwen2.5-vl-7b-instruct"      # Model identifier

# Timeouts and Paths
request_timeout: 120.0                # API request timeout in seconds
history_file: "chat_history.json"    # Conversation history file

# Usage:
# 1. Copy this file to config.yaml
# 2. Set AYYY_CONFIG_FILE=config.yaml environment variable
# 3. Or modify the values directly in this file
#
# Environment variables will override these settings:
# - AYYY_BASE_URL
# - AYYY_API_KEY  
# - AYYY_MODEL
# - AYYY_TIMEOUT
# - AYYY_HISTORY_FILE